[versions]
fawe = "2.15.3"
mongodb = "5.9.2"
mccoroutine = "2.22.0"
interfaces = "2.1.1-SNAPSHOT"
kotlinxSerialization = "1.11.0"
scoreboard = "2.8.2"
nuvotifier = "2.7.2"

[libraries]
# Fawe
fawe-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }

# MongoDB
mongodb = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodb" }

# Mccoroutine
mccoroutine-bukkit-api = { module = "com.github.shynixn.mccoroutine:mccoroutine-bukkit-api", version.ref = "mccoroutine" }
mccoroutine-bukkit-core = { module = "com.github.shynixn.mccoroutine:mccoroutine-bukkit-core", version.ref = "mccoroutine" }

mccoroutine-velocity-api = { module = "com.github.shynixn.mccoroutine:mccoroutine-velocity-api", version.ref = "mccoroutine" }
mccoroutine-velocity-core = { module = "com.github.shynixn.mccoroutine:mccoroutine-velocity-core", version.ref = "mccoroutine" }

# Noxcrew
interfaces = { module = "com.noxcrew.interfaces:interfaces", version.ref = "interfaces" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Megavex Scoreboard Library
scoreboard-library-api = { module = "net.megavex:scoreboard-library-api", version.ref = "scoreboard" }
scoreboard-library-implementation = { module = "net.megavex:scoreboard-library-implementation", version.ref = "scoreboard" }
scoreboard-library-extra-kotlin = { module = "net.megavex:scoreboard-library-extra-kotlin", version.ref = "scoreboard" }

# NuVotifier
nuvotifier-api = { module = "com.github.NuVotifier.NuVotifier:nuvotifier-api", version.ref = "nuvotifier" }
nuvotifier-velocity = { module = "com.github.NuVotifier.NuVotifier:nuvotifier-velocity", version.ref = "nuvotifier" }

[bundles]
ggnext-core = [
    "mccoroutine-bukkit-api",
    "mccoroutine-bukkit-core",
    "mongodb",
    "interfaces",
    "kotlinx-serialization-json",
    "scoreboard-library-api",
    "scoreboard-library-extra-kotlin"
]

ggnext-velocity = [
    "mongodb",
    "mccoroutine-velocity-api",
    "mccoroutine-velocity-core"
]